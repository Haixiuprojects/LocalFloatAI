name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build portable EXE
        run: python -m PyInstaller --clean --noconfirm build\LocalFloatAI.spec
      - name: Copy runtime files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\LocalFloatAI\models | Out-Null
          Copy-Item config.example.json dist\LocalFloatAI\ -Force
          Copy-Item README.md dist\LocalFloatAI\ -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LocalFloatAI-windows-x64
          path: dist/LocalFloatAI
